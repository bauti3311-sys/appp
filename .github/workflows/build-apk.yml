name: Build Spotlight Next Android Overlay APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Web Bundle
        run: |
          npm install
          npm run build

      - name: Build Android App with Overlay Permissions
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Spotlight Next" "dev.bautista.spotlight" --web-dir dist || true
          npx cap add android || true
          npx cap sync android

          # Inyectar permisos obligatorios de superposición y consultas de paquetes en el manifiesto
          sed -i 's/<application/<uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" \/>\n    <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" \/>\n    <application/' android/app/src/main/AndroidManifest.xml

          cd android
          echo "configurations.all { exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'; exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8' }" >> app/build.gradle
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Spotlight-Next-v3.0-Overlay-ARM64.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
